name: Familjetavla Test
version: "0.11.1"
slug: familjetavla_test
description: TEST – egen version med Volvo/bensinbil och dammsugare, bredvid originalet. Familjetavla för surfplattan – kalendrar, barnvecka, skola, sport, sopor, inköp och elpris, plus bilar, ljus och värme från Home Assistant.
url: https://github.com/denmol/familjetavla
arch:
  - amd64
  - aarch64
image: ghcr.io/denmol/familjetavla-{arch}
startup: application
boot: auto
# Home Assistant restarts the add-on if this stops answering.
watchdog: http://[HOST]:[PORT:8099]/api/health
ingress: true
ingress_port: 8099
panel_icon: mdi:flask-outline
panel_title: Familjetavla Test
# Syns i sidomenyn för alla inloggade, inte bara admins (barn och andra hushållsmedlemmar).
panel_admin: false
homeassistant_api: true
# Öppna port 8099 om surfplattan ska nå tavlan direkt (http://homeassistant.local:8099) utan att
# logga in i Home Assistant. Sätt då en PIN för inställningarna i guiden.
# Https med Home Assistants certifikat (fullchain.pem/privkey.pem i ssl-mappen): öppna port 8443.
map:
  - type: ssl
    read_only: true
ports:
  8099/tcp: null
  8443/tcp: null
ports_description:
  8099/tcp: Direktåtkomst för väggplattan (valfritt)
  8443/tcp: Https med Home Assistants certifikat – krävs för att installera som app på Android (valfritt)
environment:
  TZ: Europe/Stockholm
  UPDATE_CHECK: "off"
