name: Familjetavla Test
version: "0.11.1"
slug: familjetavla_test
description: TEST – egen version med Volvo/bensinbil och dammsugare, bredvid originalet. Familjetavla för surfplattan – kalendrar, barnvecka, skola, sport, sopor, inköp och elpris, plus bilar, ljus och värme från Home Assistant.
url: https://github.com/denmol/familjetavla
arch:
  - amd64
  - aarch64
# Version höjs av Bygg image när imagen finns (bygger på package.json). Egen image från det här repots Bygg image (inte originalets), så testversionen är den som körs.
image: ghcr.io/denmol/familjetavla-{arch}
startup: application
boot: auto
# Home Assistant restarts the add-on if this stops answering.
watchdog: http://[HOST]:[PORT:8099]/api/health
ingress: true
ingress_port: 8099
panel_icon: mdi:flask-outline
panel_title: Familjetavla Test
homeassistant_api: true
# Öppna en port om surfplattan ska nå tavlan direkt utan att logga in i Home Assistant. Originalet
# använder 8099 – ge testversionen en annan (t.ex. 8098) under fliken Nätverk så att båda kan köra.
# Sätt då en PIN för inställningarna i guiden.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direktåtkomst för väggplattan (valfritt)
environment:
  TZ: Europe/Stockholm
  # "Ny version finns" läser originalets config.yaml; testversionen uppdateras via sitt eget förråd.
  UPDATE_CHECK: "off"
